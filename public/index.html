<!DOCTYPE html>
<html lang="en">
<head>
  <META http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <META http-equiv="Pragma" content="no-cache" />
  <META http-equiv="Expires" content="0" />
  <META content="IE=11.0000" http-equiv="X-UA-Compatible">
  <META charset="utf-8">
  <META name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <META name="navico-store" content="mfd-insight-store">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <title>Chain and Depth</title>
  <script src="NoSleep.min.js"></script>
  <link rel="stylesheet" href="style.css?v=20260923cp">
</head>
<body>
  <div class="app" id="app">
    <section class="panel">
      <div class="tile">
        <div class="caption">Depth</div>
        <div class="readout" id="depthRow">
          <span id="depth" class="value"></span><span class="unit">m</span>
        </div>
      </div>
    </section>

    <hr>

    <section class="panel">
      <div class="tile">
        <div class="caption">Chain</div>
        <div class="readout" id="chainRow">
          <span id="chain" class="value"></span><span class="unit">m</span>
        </div>
      </div>
    </section>

    <div class="deck" id="actions">
      <button type="button" class="key" id="toggle">
        <span class="label">Lock</span>
      </button>
      <div class="key slider" id="resetSlider" data-mode="slider" role="slider" aria-label="Reset chain counter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="slider-track">
          <div class="slider-fill" id="resetFill"></div>
          <div class="slider-knob" id="resetThumb"></div>
        </div>
        <span class="label" id="resetHint">Reset</span>
      </div>
    </div>
    <p class="meta" id="statusLine"></p>
    <p id="devicePending" class="muted is-hidden">
      Approve this device in Signal K → Security → Access Requests
    </p>
  </div>
  <script src="app.js?v=20260923cp"></script>
</body>
</html>
